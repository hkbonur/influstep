name = "influstep"
main = "./worker/index.ts"
compatibility_date = "2026-02-28"
compatibility_flags = ["nodejs_compat"]

[vars]
# The Convex deployment the worker calls for /go and /p. Override per environment.
CONVEX_URL = "http://127.0.0.1:3220"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/go/*", "/p/*"]

[observability]
enabled = true
